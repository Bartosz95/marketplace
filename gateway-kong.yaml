_format_version: "3.0"

plugins:
  - name: cors
    config:
      origins:
        - http://localhost
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
      exposed_headers:
        - Content-Length
      credentials: false
      max_age: 3600
      preflight_continue: false

services:
  - name: users-service
    url: http://users-api:3000
    routes:
      - name: users-route
        paths:
          - /api/v1/users
        strip_path: false

  - name: payments-service
    url: http://payment-api:3000
    routes:
      - name: payments-route
        paths:
          - /api/v1/payments
        strip_path: false

  - name: listings-service
    url: http://listings-api:3000
    routes:
      - name: listings-route
        paths:
          - /api/v1/listings
        strip_path: false
