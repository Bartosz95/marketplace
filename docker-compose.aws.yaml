x-backend: &backend
  image: ${ECR_REGISTRY:?Set ECR_REGISTRY}/marketplace/backend:${IMAGE_TAG:-latest}
  restart: unless-stopped
  env_file:
    - backend/.env
  environment:
    DB_HOST: db
    DB_PORT: "5432"
    DB_USER: default_user
    DB_NAME: marketplace
  depends_on:
    db:
      condition: service_healthy
  networks:
    - app

services:
  db:
    image: postgres:17.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres-storage:/var/lib/postgresql/data
      - ./db-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - app

  listings-api:
    <<: *backend
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: default_user
      DB_NAME: marketplace
      APP_NAME: listings-api
      APP_HOST: 0.0.0.0
      APP_PORT: "3000"
      USERS_API_URL: http://users-api:3000

  listings-state-pm:
    <<: *backend
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: default_user
      DB_NAME: marketplace
      APP_NAME: listings-state-pm

  users-api:
    <<: *backend
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: default_user
      DB_NAME: marketplace
      APP_NAME: users-api
      APP_HOST: 0.0.0.0
      APP_PORT: "3000"

  users-state-pm:
    <<: *backend
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: default_user
      DB_NAME: marketplace
      APP_NAME: users-state-pm

  purchases-state-pm:
    <<: *backend
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: default_user
      DB_NAME: marketplace
      APP_NAME: purchases-state-pm

  payment-api:
    <<: *backend
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: default_user
      DB_NAME: marketplace
      APP_NAME: payment-api
      APP_HOST: 0.0.0.0
      APP_PORT: "3000"

  payment-pm:
    <<: *backend
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: default_user
      DB_NAME: marketplace
      APP_NAME: payment-pm

  payment-reconciliation-pm:
    <<: *backend
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: default_user
      DB_NAME: marketplace
      APP_NAME: payment-reconciliation-pm
      APP_LOG_LEVEL: info

  ui:
    image: ${ECR_REGISTRY:?Set ECR_REGISTRY}/marketplace/frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks:
      - app

  kong:
    image: kong:3.9.1
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "127.0.0.1:8001"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
    volumes:
      - ./gateway-kong.aws.yaml:/kong/kong.yml:ro
    depends_on:
      - ui
      - users-api
      - listings-api
      - payment-api
    networks:
      - app

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.aws:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - kong
    networks:
      - app

volumes:
  postgres-storage:
    name: marketplace-postgres
  caddy-data:
    name: marketplace-caddy-data
  caddy-config:
    name: marketplace-caddy-config

networks:
  app:
    driver: bridge
