services:
  kong:
    image: kong:3.9.1
    container_name: kong-apigateway
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
    ports:
      - "3000:8000"
      - "127.0.0.1:8001:8001"
    volumes:
      - ./gateway-kong.yaml:/kong/kong.yml:ro
    depends_on:
      - users-api
      - listings-api
      - payment-api
    networks:
      - monitoring
      - app
  ui:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api/v1}
        NEXT_PUBLIC_AUTH0_DOMAIN: ${NEXT_PUBLIC_AUTH0_DOMAIN:-}
        NEXT_PUBLIC_AUTH0_CLIENT_ID: ${NEXT_PUBLIC_AUTH0_CLIENT_ID:-}
        NEXT_PUBLIC_AUTH0_AUDIENCE: ${NEXT_PUBLIC_AUTH0_AUDIENCE:-}
        NEXT_PUBLIC_AUTH0_REDIRECT_URI: ${NEXT_PUBLIC_AUTH0_REDIRECT_URI:-http://localhost}
    ports:
      - 80:3000
    env_file:
      - frontend/.env
    depends_on:
      - listings-api
      - users-api
    networks:
      - monitoring
      - app

  listings-api:
    build:
      context: backend
      dockerfile: Dockerfile
    env_file:
      - backend/.env
    environment:
      - APP_NAME=listings-api
      - APP_HOST=localhost
      - APP_PORT=3000
      - DB_HOST=db
      - USERS_API_URL=http://users-api:3000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - monitoring
      - app

  listings-state-pm:
    build:
      context: backend
      dockerfile: Dockerfile
    env_file:
      - backend/.env
    environment:
      - DB_HOST=db
      - APP_NAME=listings-state-pm
      - DB_HOST=db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - monitoring
      - app

  users-api:
    build:
      context: backend
      dockerfile: Dockerfile
    env_file:
      - backend/.env
    environment:
      - APP_NAME=users-api
      - APP_HOST=localhost
      - APP_PORT=3000
      - DB_HOST=db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - monitoring
      - app
  payment-api:
    build:
      context: backend
      dockerfile: Dockerfile
    env_file:
      - backend/.env
    environment:
      - APP_NAME=payment-api
      - APP_HOST=localhost
      - APP_PORT=3000
      - DB_HOST=db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - monitoring
      - app
  users-state-pm:
    build:
      context: backend
      dockerfile: Dockerfile
    env_file:
      - backend/.env
    environment:
      - DB_HOST=db
      - APP_NAME=users-state-pm
      - DB_HOST=db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - monitoring
      - app

  purchases-state-pm:
    build:
      context: backend
      dockerfile: Dockerfile
    env_file:
      - backend/.env
    environment:
      - APP_NAME=purchases-state-pm
      - DB_HOST=db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - monitoring
      - app
  payment-pm:
    build:
      context: backend
      dockerfile: Dockerfile
    env_file:
      - backend/.env
    environment:
      - APP_NAME=payment-pm
      - DB_HOST=db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - monitoring
      - app
  payment-reconciliation-pm:
    build:
      context: backend
      dockerfile: Dockerfile
    env_file:
      - backend/.env
    environment:
      - APP_NAME=payment-reconciliation-pm
      - APP_LOG_LEVEL=info
      - DB_HOST=db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - monitoring
      - app
  db:
    image: postgres:17.6
    container_name: postgres_container
    restart: always
    shm_size: 128mb
    environment:
      - POSTGRES_PASSWORD=password
    ports:
      - 5432:5432
    volumes:
      - postgres-storage:/var/lib/postgresql/data
      - ./db-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U default_user -d marketplace"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - app
  stripe-cli:
    image: stripe/stripe-cli:v1.27.0
    profiles: ["stripe-local"]
    command:
      - listen
      - --events
      - checkout.session.completed,checkout.session.async_payment_succeeded,checkout.session.async_payment_failed,checkout.session.expired
      - --forward-to
      - http://payment-api:3000/api/v1/payments/stripe/webhook
    env_file:
      - backend/.env
    depends_on:
      - payment-api
    networks:
      - app
  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: node-exporter
    command:
      - "--path.rootfs=/host"
    pid: host
    volumes:
      - /:/host:ro
    restart: unless-stopped
    networks:
      - monitoring

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    container_name: cadvisor
    restart: always
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    command:
      - --docker_only
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:v3.16.0
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml
      - prometheus-storage:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:13.3.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      - GF_LOG_LEVEL=warn
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    volumes:
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-storage:/var/lib/grafana
    networks:
      - monitoring

volumes:
  postgres-storage:
    driver: local
  prometheus-storage:
    driver: local
  grafana-storage:
    driver: local
networks:
  monitoring:
    driver: bridge
  app:
    driver: bridge
