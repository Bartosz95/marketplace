  listings-api:
    build:
      context: backend
      dockerfile: Dockerfile
    env_file:
      - backend/.env
    environment:
      - APP_NAME=listings-api
      - APP_HOST=localhost
      - APP_PORT=3000
      - DB_HOST=db
      - USERS_API_URL=http://users-api:3000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - monitoring
      - app

  listings-state-pm:
    build:
      context: backend
      dockerfile: Dockerfile
    env_file:
      - backend/.env
    environment:
      - DB_HOST=db
      - APP_NAME=listings-state-pm
      - DB_HOST=db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - monitoring
      - app

  users-api:
    build:
      context: backend
      dockerfile: Dockerfile
    env_file:
      - backend/.env
    environment:
      - APP_NAME=users-api
      - APP_HOST=localhost
      - APP_PORT=3000
      - DB_HOST=db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - monitoring
      - app
  payment-api:
    build:
      context: backend
      dockerfile: Dockerfile
    env_file:
      - backend/.env
    environment:
      - APP_NAME=payment-api
      - APP_HOST=localhost
      - APP_PORT=3000
      - DB_HOST=db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - monitoring
      - app
  users-state-pm:
    build:
      context: backend
      dockerfile: Dockerfile
    env_file:
      - backend/.env
    environment:
      - DB_HOST=db
      - APP_NAME=users-state-pm
      - DB_HOST=db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - monitoring
      - app

  purchases-state-pm:
    build:
      context: backend
      dockerfile: Dockerfile
    env_file:
      - backend/.env
    environment:
      - APP_NAME=purchases-state-pm
      - DB_HOST=db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - monitoring
      - app
  payment-pm:
    build:
      context: backend
      dockerfile: Dockerfile
    env_file:
      - backend/.env
    environment:
      - APP_NAME=payment-pm
      - DB_HOST=db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - monitoring
      - app
  db:
    image: postgres:17
    container_name: postgres_container
    restart: always
    shm_size: 128mb
    environment:
      - POSTGRES_PASSWORD=password
    ports:
      - 5432:5432
    volumes:
      - postgres-storage:/var/lib/postgresql/data
      - ./db-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U default_user -d marketplace"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - app
  stripe-cli:
    image: stripe/stripe-cli:latest
    profiles: ["stripe-local"]
    command:
      - listen
      - --forward-to
      - http://payment-api:3000/api/v1/payments/stripe/webhook
    env_file:
      - backend/.env
    depends_on:
      - payment-api
    networks:
      - app
